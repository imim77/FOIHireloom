[project]
name = "foihireloom"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "defusedxml>=0.7,<1",
    "fastmcp>=3.0,<4",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
foihireloom-fetch-job-pages = "FOIHireloom.commands.fetch_job_pages:main"
foihireloom-mcp = "FOIHireloom.main:main"
foihireloom-register-sources = "FOIHireloom.commands.register_sources:main"
foihireloom-sync-jobs = "FOIHireloom.commands.sync_jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/FOIHireloom"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
]
