[project]
name = "foihireloom"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastmcp>=3.0,<4"]

[project.scripts]
foihireloom-mcp = "FOIHireloom.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/FOIHireloom"]
