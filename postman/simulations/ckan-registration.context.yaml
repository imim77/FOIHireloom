purpose:
  stands_in_for: >-
    The public data.gov.hr CKAN package_show metadata GET. The local mock uses
    tests/fixtures/ckan_package_show.json, projected from the real response on
    2026-10-29, and the subset contract in postman/ckan.openapi.yaml. An owner
    mock search was attempted but unavailable because Postman CLI was signed out.
    Orbit discovery returned CKAN demo/Slovak endpoints, so the Croatian provider
    URL and payload were verified directly against data.gov.hr instead.
  unblocks: >-
    From the project root run: postman simulation run
    postman/simulations/ckan-registration.sim.yaml --port 4010 --no-history
    --output ndjson. Use CKAN_BASE_URL=http://127.0.0.1:4010/ckan with
    uv run --locked foihireloom-register-sources --dry-run. For writes, configure
    DATABASE_URL and apply Alembic migrations first. The ckan-error route injects
    HTTP 503; ckan-slow injects 500 ms latency (test with CKAN_TIMEOUT=0.1).
    One-port routing allows selecting these controlled variants independently.
    The fs-backed fixture mock is local-only and was not pushed or deployed.
assumptions:
  - id: observed-croatian-resource-shape
    status: supported
    claim: >-
      The selected dataset response observed on 2026-10-29 contained 21 Croatian
      XML county resources and one EU resource, with labels in description and
      name absent/null.
    reason: The public API response and new CkanClient both returned this shape.
    verification: >-
      Retrieved the real package_show response and ran the production CLI against
      it with disposable PostgreSQL. First registration reported 21 counties and
      21 feeds added, with one resource skipped. A second run reported zero added
      and 21 unchanged. SQL confirmed 21 counties, 21 county feeds, zero EU feeds,
      zero jobs and zero sync attempts. This is an observation, not a guarantee
      that the provider's future resource set remains unchanged.
    source: >-
      https://data.gov.hr/ckan/api/3/action/package_show?id=slobodna-radna-mjesta-po-zupanijama-u-rh-i-eu;
      tests/fixtures/ckan_package_show.provenance.md;
      tests/test_source_feed_registration.py
    updated_at: '2026-10-29'
  - id: action-errors-can-use-success-envelope
    status: supported
    claim: A successful HTTP status alone does not prove a successful CKAN action.
    reason: CKAN documents success/error envelopes, which the client validates.
    verification: >-
      Client tests reject HTTP 200 with success=false and reject malformed JSON,
      missing resource arrays, invalid UUIDs and non-HTTP resource URLs. These
      controlled error bodies follow the documented envelope; no real provider
      outage was induced.
    source: https://docs.ckan.org/en/latest/api/; tests/test_ckan_client.py
    updated_at: '2026-10-29'
  - id: transport-failures-do-not-register-partial-data
    status: supported
    claim: >-
      In the scenarios exercised, a metadata HTTP 503 or read timeout prevents
      registration from modifying reference data.
    reason: The real CLI ran through the local simulation against disposable PostgreSQL.
    verification: >-
      With Postman CLI 1.77.0, ckan returned HTTP 200 and the CLI exited zero with
      21 unchanged feeds. The request event showed GET /api/3/action/package_show
      with the expected dataset id. ckan-error made the CLI exit 1 with HTTP 503;
      ckan-slow with CKAN_TIMEOUT=0.1 made it exit 1. A direct call confirmed the
      wrapped exception was httpx.ReadTimeout. SQL still reported 21 county feeds.
      Injected failures need not appear as mock request events; caller exit status
      and resulting database state were checked. The provider's actual outage
      behavior, latency and availability guarantees were not established.
    source: >-
      postman/simulations/ckan-registration.sim.yaml;
      src/FOIHireloom/commands/register_sources.py;
      tests/test_register_sources_command.py;
      tests/test_source_feed_registration.py
    updated_at: '2026-10-29'
  - id: resource-id-replacement
    status: unknown
    claim: CKAN may replace a resource UUID while retaining the same feed URL.
    reason: This is a supported recovery case, not an observed provider event.
    verification: >-
      A controlled service test replaces the UUID in the captured metadata and
      confirms reuse of the existing database feed ID without duplicate rows.
      Conflicting resource IDs and URLs abort the transaction. Provider policy
      and real historical identifier replacement have not been verified.
    source: tests/test_source_feed_registration.py
    updated_at: '2026-10-29'
  - id: rss-availability
    status: unknown
    claim: The advertised RSS URLs are reachable and contain current job vacancies.
    reason: Metadata registration does not download or parse RSS contents.
    verification: >-
      Only CKAN metadata was retrieved. Verify RSS reachability, actual payload
      shape, encoding and completeness when implementing the feed client/parser.
    source: tests/fixtures/ckan_package_show.json; src/FOIHireloom/integrations/ckan_client.py
    updated_at: '2026-10-29'
fingerprints:
  - id: registration-local-2026-10-29
    date: '2026-10-29'
    commit: >-
      5592c01ed5d50d454c60aeafeaaaacccab7ac2f1 with uncommitted CLI, tests and
      simulation additions during verification; pre-existing README deletions
      were excluded from feature commits.
    cli: >-
      Postman 1.77.0. Mock generation wrote the files then exited with a macOS
      SecItemCopyMatching error. The local simulation subsequently started with
